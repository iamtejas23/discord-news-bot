services:
  discord-news-bot:
    container_name: discord-news-bot
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    restart: always
    env_file:
      - .env
    volumes:
      - ./data:/data
    environment:
      TZ: UTC
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - print('healthy')
      interval: 30s
      timeout: 5s
      retries: 3
