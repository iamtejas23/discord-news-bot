services:

  discord-news-bot:

    container_name: discord-news-bot

    build:
      context: .

    restart: always

    env_file:
      - .env

    volumes:
      - ./data:/data

    environment:
      TZ: UTC

    healthcheck:

      test:
        [
          "CMD",
          "python",
          "-c",
          "print('healthy')"
        ]

      interval: 30s

      timeout: 5s

      retries: 3